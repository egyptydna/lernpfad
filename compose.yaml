services:
  app:
    build: .
    image: lernpfad:local
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://lernpfad:${POSTGRES_PASSWORD:?Run npm run setup}@db:5432/lernpfad
      DATA_DIR: /app/.data
      CHATGPT_LOCAL: ${CHATGPT_LOCAL:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ORIGIN: ${APP_ORIGIN:-}
      EXTERNAL_WORKER: "true"
    volumes:
      - documents:/app/.data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    image: lernpfad:local
    command: ["npm", "run", "worker"]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://lernpfad:${POSTGRES_PASSWORD:?Run npm run setup}@db:5432/lernpfad
      DATA_DIR: /app/.data
      CHATGPT_LOCAL: ${CHATGPT_LOCAL:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      EXTERNAL_WORKER: "true"
    volumes:
      - documents:/app/.data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lernpfad
      POSTGRES_USER: lernpfad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lernpfad -d lernpfad"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres:
  documents:
